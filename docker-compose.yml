services:
  scryer-request-bot:
    image: ghcr.io/crypticzxi/scryerrequestbot:latest
    # To build from source instead, comment out "image" above and uncomment:
    # build: .
    container_name: scryer-request-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
